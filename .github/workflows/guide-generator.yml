name: Generate Field Guide

# Practical genus guides — weekdays at 6:10 AM Pacific ≈ 13:10 UTC during PDT
# (staggered 10 min after Understory to avoid a push race on Mon/Wed/Fri).
on:
  schedule:
    - cron: "10 13 * * 1-5"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Generate next guide
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LP_ALLOW_INAT: "1"   # body images may fall back to iNaturalist (free, CC BY)
        run: |
          cd pipeline
          python generate_guide.py
          python generate_sitemap.py
          python generate_feed.py

      - name: Detect generated article
        id: gen
        run: |
          slug=$(git status --porcelain field-guide/ | grep '^?? field-guide/' | head -1 | sed 's|^?? field-guide/||' | sed 's|/.*||')
          if [ -n "$slug" ] && [ -f "field-guide/$slug/_data.json" ]; then
            title=$(python3 -c "import json; print(json.load(open('field-guide/$slug/_data.json'))['title'])")
            hero=$(python3 -c "import json; print(json.load(open('field-guide/$slug/_data.json')).get('hero',''))")
            genus=$(python3 -c "import json; print(json.load(open('field-guide/$slug/_data.json')).get('genus',''))")
            deck=$(python3 -c "import json; print(json.load(open('field-guide/$slug/_data.json')).get('deck',''))")
            echo "slug=$slug" >> $GITHUB_OUTPUT
            echo "title=$title" >> $GITHUB_OUTPUT
            echo "hero=$hero" >> $GITHUB_OUTPUT
            echo "genus=$genus" >> $GITHUB_OUTPUT
            echo "deck<<EOF" >> $GITHUB_OUTPUT
            echo "$deck" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push
        run: |
          git config user.name "leaf-people-bot"
          git config user.email "bot@percentearth.co"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish."
          elif [ -n "${{ steps.gen.outputs.slug }}" ]; then
            git commit -m "Field Guide: draft article (pending review) — ${{ steps.gen.outputs.slug }}"
            git push
          else
            git commit -m "Field Guide: sitemap/feed refresh (queue empty, no new draft)"
            git push
          fi

      - name: Create review issue
        if: steps.gen.outputs.slug != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          slug="${{ steps.gen.outputs.slug }}"
          title="${{ steps.gen.outputs.title }}"
          genus="${{ steps.gen.outputs.genus }}"
          hero="${{ steps.gen.outputs.hero }}"
          deck="${{ steps.gen.outputs.deck }}"
          gh issue create \
            --title "Review: $title" \
            --label "review-queue" \
            --body "**Section:** Field Guide · **${genus}**
          **Slug:** \`field-guide/${slug}\`

          ${deck}

          ![hero](https://leafpeople.app${hero})

          ### Next step

          1. [**Open the review queue →**](https://leafpeople.app/review)
          2. Inspect the hero + body images and caption
          3. Use the [Publish workflow](https://github.com/${{ github.repository }}/actions/workflows/publish.yml) with slug \`field-guide/${slug}\` to publish, or pick reject

          ---
          _Auto-created by guide-generator cron. Closing this issue does not publish — use the Publish workflow._" || echo "Issue create failed (non-fatal)"
