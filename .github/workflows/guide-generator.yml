name: Generate Field Guide

# Practical genus guides — weekdays at 6:10 AM Pacific ≈ 13:10 UTC during PDT
# (staggered 10 min after Understory to avoid a push race on Mon/Wed/Fri).
on:
  schedule:
    - cron: "10 13 * * 1-5"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Generate next guide
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd pipeline
          python generate_guide.py
          python generate_sitemap.py

      - name: Commit & push
        run: |
          git config user.name "leaf-people-bot"
          git config user.email "bot@percentearth.co"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish."
          else
            git commit -m "Field Guide: publish next queued guide"
            git push
          fi
