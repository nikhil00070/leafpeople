name: Publish pending article

# Promote a pending article to published, or reject it outright.
# Triggered from the /review page or manually via Actions UI.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Article slug, e.g. the-leaf/petiole-tells-the-truth"
        required: true
        type: string
      action:
        description: "publish (flip to live) or reject (delete pending article)"
        required: true
        default: "publish"
        type: choice
        options:
          - publish
          - reject

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r pipeline/requirements.txt
      - name: Run publish.py
        run: |
          if [ "${{ inputs.action }}" = "reject" ]; then
            python pipeline/publish.py "${{ inputs.slug }}" --reject
          else
            python pipeline/publish.py "${{ inputs.slug }}"
          fi

      # Commit + push the manifest change FIRST — the article going live is
      # the load-bearing step; the FCM push below is supplemental. Earlier
      # ordering put send_push.py before the commit, so an FCM failure (e.g.
      # missing `requests` dependency) aborted the workflow and the manifest
      # flip was thrown away with the runner. Articles "published" via
      # /review never reached the live site.
      - name: Commit & push
        run: |
          git config user.name "leaf-people-bot"
          git config user.email "bot@percentearth.co"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            ACTION="${{ inputs.action }}"
            SLUG="${{ inputs.slug }}"
            if [ "$ACTION" = "reject" ]; then
              git commit -m "Review: reject $SLUG"
            else
              git commit -m "Review: publish $SLUG"
            fi
            git pull --rebase origin main
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $attempt rejected; retrying after fetch"; sleep 5
            done
          fi

      # NO publish-time push. The app owns story notifications via its client-side
      # drip (StoryDripService): each subscriber's board reveals one story at a time
      # on a personal schedule (welcome pair, then one every 2 days) and fires a LOCAL
      # notification exactly when a story lands. An FCM "stories" push on approval
      # jumped that queue — it pinged users about stories the drip won't surface for
      # days (the "10 notifications, no stories" bug). Approved articles just enter
      # feed.json and the drip picks them up in order. (send_push.py is kept for a
      # future *deliberate* broadcast, but is no longer wired to every approval.)

      - name: Close matching review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find issues labeled 'review-queue' whose title matches this slug's article
          slug="${{ inputs.slug }}"
          art_slug="${slug##*/}"
          # Look up the article title from manifest
          section="${slug%/*}"
          title=$(python3 -c "
          import json
          for e in json.load(open('${section}/manifest.json')):
              if e['slug'] == '${art_slug}': print(e['title']); break
          " 2>/dev/null || echo "")
          if [ -n "$title" ]; then
            # Find issue with matching title and close
            issue_number=$(gh issue list --label "review-queue" --state open --json number,title \
              --jq ".[] | select(.title == \"Review: $title\") | .number" | head -1)
            if [ -n "$issue_number" ]; then
              ACTION="${{ inputs.action }}"
              if [ "$ACTION" = "reject" ]; then
                gh issue close "$issue_number" --comment "Rejected via publish workflow."
              else
                gh issue close "$issue_number" --comment "Published to live."
              fi
              echo "Closed issue #$issue_number"
            fi
          fi || echo "Issue close failed (non-fatal)"
